name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend syntax
        run: node --check src/main/resources/static/app.js

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: prompt-coach-jar
          path: target/prompt-coach-*.jar
          if-no-files-found: error